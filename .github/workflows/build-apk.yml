name: Build Working APK
on:
  repository_dispatch:
    types: [build_command]
  workflow_dispatch:
    inputs:
      firebase_id:
        description: 'Firebase App ID'
        required: false
      agora_id:
        description: 'Agora App ID'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Modules
        run: npm install fs-extra

      - name: Inject Keys (Firebase & Agora)
        run: |
          node config-injector.js "${{ github.event.inputs.firebase_id || github.event.client_payload.firebase_id }}" "${{ github.event.inputs.agora_id || github.event.client_payload.agora_id }}"

      - name: Auto Generate Official Gradlew Engine
        run: gradle wrapper --gradle-version 8.4

      - name: Build APK with Google Built-in SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Generated-App
          path: app/build/outputs/apk/debug/*.apk
